  <style>
        body {
            box-sizing: border-box;
        }
        
        * {
            font-family: 'Cairo', 'Tajawal', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0a1628 0%, #1a2744 50%, #0f1f3d 100%);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .country-marker {
            cursor: pointer;
            transition: all 0.3s ease;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }
        
        .country-marker:hover {
            transform: scale(1.3);
            filter: drop-shadow(0 4px 8px rgba(255, 255, 255, 0.6));
        }
        
        .country-marker.active {
            animation: pulse 0.8s ease-in-out;
            filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.9));
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
        }
        
        .info-card {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        
        .search-input, .filter-select {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            transition: all 0.3s ease;
        }
        
        .search-input:focus, .filter-select:focus {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(96, 165, 250, 0.6);
            outline: none;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }
        
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }
        
        .filter-select option {
            background: #1a2744;
            color: white;
        }
        
        .continent-path {
            transition: all 0.3s ease;
        }
        
        .continent-path:hover {
            opacity: 1 !important;
            filter: brightness(1.2);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
        }
        
        .info-item {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, rgba(37, 99, 235, 0.12) 100%);
            padding: 14px;
            border-radius: 10px;
            border-right: 4px solid #3b82f6;
            transition: all 0.3s ease;
        }
        
        .info-item:hover {
            transform: translateX(-4px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        
        .flag-emoji {
            font-size: 72px;
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInUp 0.5s ease-out;
        }
        
        .map-container {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d4a6f 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }
    </style>

        let filteredCountries = [...countries];
        let selectedCountry = null;

        function renderCountries() {
            const svg = document.getElementById('world-map');
            const existingMarkers = svg.querySelectorAll('.country-marker');
            existingMarkers.forEach(marker => marker.remove());

            filteredCountries.forEach((country, index) => {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'country-marker');
                g.setAttribute('data-country-id', country.id);
                g.style.animationDelay = `${index * 0.05}s`;
                
                // Pin marker
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', country.x);
                circle.setAttribute('cy', country.y);
                circle.setAttribute('r', '8');
                circle.setAttribute('fill', '#ffd700');
                circle.setAttribute('stroke', '#ffffff');
                circle.setAttribute('stroke-width', '2');
                
                // Pulse circle
                const pulseCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                pulseCircle.setAttribute('cx', country.x);
                pulseCircle.setAttribute('cy', country.y);
                pulseCircle.setAttribute('r', '12');
                pulseCircle.setAttribute('fill', 'none');
                pulseCircle.setAttribute('stroke', '#ffd700');
                pulseCircle.setAttribute('stroke-width', '1.5');
                pulseCircle.setAttribute('opacity', '0.5');
                
                g.appendChild(pulseCircle);
                g.appendChild(circle);
                
                g.addEventListener('click', () => selectCountry(country));
                
                svg.appendChild(g);
            });
        }

        function selectCountry(country) {
            selectedCountry = country;
            
            const markers = document.querySelectorAll('.country-marker');
            markers.forEach(m => m.classList.remove('active'));
            
            const selectedMarker = document.querySelector(`[data-country-id="${country.id}"]`);
            if (selectedMarker) {
                selectedMarker.classList.add('active');
            }
            
            const infoPanel = document.getElementById('info-panel');
            const countryInfo = document.getElementById('country-info');
            
            countryInfo.innerHTML = `
                <div class="flag-emoji">${country.flag}</div>
                <h2 class="text-4xl font-bold text-center mb-8" style="color: ${defaultConfig.text_color}">${country.name}</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <div class="text-sm opacity-70 mb-2">🏛️ العاصمة</div>
                        <div class="font-bold text-xl">${country.capital}</div>
                    </div>
                    <div class="info-item">
                        <div class="text-sm opacity-70 mb-2">🌍 القارة</div>
                        <div class="font-bold text-xl">${country.continentAr}</div>
                    </div>
                    <div class="info-item">
                        <div class="text-sm opacity-70 mb-2">👥 عدد السكان</div>
                        <div class="font-bold text-xl">${country.population}</div>
                    </div>
                    <div class="info-item">
                        <div class="text-sm opacity-70 mb-2">📏 المساحة</div>
                        <div class="font-bold text-xl">${country.area}</div>
                    </div>
                    <div class="info-item">
                        <div class="text-sm opacity-70 mb-2">💰 العملة</div>
                        <div class="font-bold text-xl">${country.currency}</div>
                    </div>
                    <div class="info-item">
                        <div class="text-sm opacity-70 mb-2">🗣️ اللغة</div>
                        <div class="font-bold text-xl">${country.language}</div>
                    </div>
                    <div class="info-item">
                        <div class="text-sm opacity-70 mb-2">🏛️ نظام الحكم</div>
                        <div class="font-bold text-xl">${country.government}</div>
                    </div>
                    <div class="info-item">
                        <div class="text-sm opacity-70 mb-2">📅 الاستقلال</div>
                        <div class="font-bold text-xl">${country.independence}</div>
                    </div>
                    <div class="info-item">
                        <div class="text-sm opacity-70 mb-2">⛰️ أعلى قمة</div>
                        <div class="font-bold text-xl">${country.highestPeak}</div>
                    </div>
                </div>
                <div class="mt-8 p-6 rounded-xl" style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, rgba(37, 99, 235, 0.15) 100%);">
                    <p class="text-lg leading-relaxed font-medium" style="color: ${defaultConfig.text_color}">${country.description}</p>
                </div>
            `;
            
            infoPanel.classList.remove('hidden');

        function filterAndSort() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const continentFilter = document.getElementById('continent-filter').value;
            const sortBy = document.getElementById('sort-select').value;
            
            filteredCountries = countries.filter(country => {
                const matchesSearch = country.name.includes(searchTerm) || 
                                    country.capital.includes(searchTerm);
                const matchesContinent = continentFilter === 'all' || 
                                       country.continent === continentFilter;
                return matchesSearch && matchesContinent;
            });
            
            if (sortBy === 'name') {
                filteredCountries.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            } else if (sortBy === 'population') {
                filteredCountries.sort((a, b) => {
                    const popA = parseFloat(a.population.replace(/[^\d.]/g, ''));
                    const popB = parseFloat(b.population.replace(/[^\d.]/g, ''));
                    return popB - popA;
                });
            } else if (sortBy === 'area') {
                filteredCountries.sort((a, b) => {
                    const areaA = parseInt(a.area.replace(/[^\d]/g, ''));
                    const areaB = parseInt(b.area.replace(/[^\d]/g, ''));
                    return areaB - areaA;
                });
            }
            
            renderCountries();
        }

        document.getElementById('search-input').addEventListener('input', filterAndSort);
        document.getElementById('continent-filter').addEventListener('change', filterAndSort);
        document.getElementById('sort-select').addEventListener('change', filterAndSort);
